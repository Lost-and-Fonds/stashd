# Mago is Stashd's only formatter. The inherited profile translates the
# shared hipsterjazzbo/php-style rules without installing PHP-CS-Fixer.
extends = "config/php-style.mago.toml"

php-version = "8.5.0"

[source]
paths = ["app", "tests"]
includes = ["vendor"]
patches = ["tools/mago/TempestStorage.php"]
excludes = [
  "./vendor/symfony/cache/Traits/ValueWrapper.php",
  "./vendor/composer",
]

[analyzer]
excludes = ["tests/**"]
ignore = [
    "mixed-argument",
    "mixed-assignment",
]

[formatter]
print-width = 180
tab-width = 4
use-tabs = false
indent-heredoc = false
space-after-logical-not-unary-prefix-operator = true
null-type-hint = "question"
space-before-arrow-function-parameter-list-parenthesis = true
always-break-named-arguments-list = false
preserve-breaking-member-access-chain = true
preserve-breaking-argument-list = true
preserve-breaking-array-like = true
preserve-breaking-parameter-list = true
preserve-breaking-attribute-list = true
preserve-breaking-conditional-expression = true
empty-line-after-opening-tag = false

[linter]
integrations = ["php-unit", "tempest"]

[linter.rules]
too-many-properties= { enabled = false }
interface-name = { psr = false }
trait-name = { psr = false }
class-name = { psr = false }
literal-named-argument = { enabled = false }
no-error-control-operator = { enabled = false }
too-many-methods = { enabled = false }
kan-defect = { enabled = false }
cyclomatic-complexity = { enabled = false }
too-many-enum-cases = { enabled = false }
no-redundant-file = { enabled = false }
assertion-style = { style = "this" }
strict-assertions = { enabled = false }
no-else-clause = { enabled = false }
no-boolean-flag-parameter = { enabled = false }
no-shorthand-ternary = { enabled = false }
no-assign-in-condition = { enabled = false }
# Legacy source files still need a strict-types/import migration before these
# two inherited style rules can be enforced without breaking existing QA.
# This is a temporary exception; remove both overrides as a focused follow-up.
strict-types = { enabled = false }
no-fully-qualified-global-class-like = { enabled = false }
tagged-todo = { enabled = false }
excessive-parameter-list = { enabled = false }
halstead = { enabled = false }
strict-behavior = { enabled = false }
no-redundant-use = { enabled = true }
no-redundant-math = { enabled = false }
no-nested-ternary = { enabled = false }
no-empty-catch-clause = { enabled = false }
no-empty-comment = { enabled = false }
single-class-per-file = { enabled = false }
no-isset = { enabled = false }
instanceof-stringable = { enabled = false }
prefer-static-closure = { enabled = false }
sensitive-parameter = { enabled = false }
#unused-pragma = { enabled = false }
