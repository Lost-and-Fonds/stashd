name: Renumber Core release history

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docker-image.yml
      - .github/workflows/renumber-core-release-history.yml
      - docs/releases/v0.1.0.md
      - scripts/renumber-core-release-history.py

permissions:
  contents: write
  packages: write

jobs:
  renumber:
    if: github.event.head_commit.message == 'chore: renumber Core release history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag Core history and container images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/renumber-core-release-history.py
