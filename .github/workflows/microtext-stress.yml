name: Filesystem measured round trip (post-merge and release)

on:
  pull_request:
    types: [closed]
    branches: [dev]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microtext-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  round-trip:
    name: Real application round trips (100 / 1000 / pinned 10000)
    # A PR closing without a merge must not run the expensive fixture.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    # Local ordered cases took ~97 min; allow ~2x per case plus setup/runner margin.
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: stashd-disposable-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENVIRONMENT: testing
      STASHD_TEST_PROCESSES: '1'
      STASHD_FILESYSTEM_STRESS_REPORT_DIR: ${{ github.workspace }}/tmp/filesystem-stress-reports
    steps:
      - name: Check out merged or released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Run independent fixture and RSS regressions
        run: python3 -m unittest discover -s tools/fixtures -p 'test_microtext*.py' -v

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql, mbstring, dom, xml, xmlwriter
          ini-values: memory_limit=128M
          coverage: none
          tools: composer:2.10.3

      - name: Locate Composer download cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache locked dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}

      - name: Install locked dependencies
        timeout-minutes: 5
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure disposable PostgreSQL fixture administrator
        run: |
          echo '127.0.0.1 lerd-postgres' | sudo tee -a /etc/hosts
          umask 077
          mkdir -p tmp/filesystem-stress-reports
          # One private key for every fresh process/retry in this job, never an ephemeral per-worker key.
          php -r 'file_put_contents(".env", "ENVIRONMENT=testing\nSIGNING_KEY=" . base64_encode(random_bytes(32)) . "\n"); chmod(".env", 0600);'
          printf '%s\n' '{"dsn":"pgsql:host=lerd-postgres;port=5432;dbname=postgres","username":"postgres","password":"stashd-disposable-ci"}' > tmp/transaction-projection-admin.json
          php -r '$db = new PDO("pgsql:host=lerd-postgres;port=5432;dbname=postgres", "postgres", "stashd-disposable-ci"); if ($db->query("SHOW server_version_num")->fetchColumn() < 160000) { exit(1); }'

      - name: Prove the full workflow with 100 Items
        timeout-minutes: 5
        run: ./bin/test.sh tests/Stress/Integration/FilesystemRoundTripStressTest.php --filter='100 Items' --compact --colors=never

      - name: Measure the full workflow with 1000 Items
        timeout-minutes: 30
        run: ./bin/test.sh tests/Stress/Integration/FilesystemRoundTripStressTest.php --filter='1,000 Items' --compact --colors=never

      - name: Measure the pinned 10000-Item Vault-only round trip and corruption control
        timeout-minutes: 180
        run: ./bin/test.sh tests/Stress/Integration/FilesystemRoundTripStressTest.php --filter='pinned 10,000 Items' --compact --colors=never

      - name: Remove private fixture configuration
        if: always()
        run: rm -f tmp/transaction-projection-admin.json .env

      - name: Retain credential-free phase reports, including incomplete checkpoints
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: filesystem-stress-measurements-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/filesystem-stress-reports/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Ensure quality checks did not modify tracked files
        if: always()
        run: git diff --exit-code
