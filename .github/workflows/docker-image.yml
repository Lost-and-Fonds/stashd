name: Docker image

on:
  push:
    branches: [main]
    tags: ["v0.1.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/v0.1.') && 'release' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Lerd development image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          load: true
          tags: stashd:ci
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
        env:
          BUILDKIT_PROGRESS: plain

      - name: Cache Composer and npm downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/composer
            ~/.npm
          key: ${{ runner.os }}-deps-${{ hashFiles('composer.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Validate and check source
        run: |
          docker run --rm --entrypoint sh \
            -v "$GITHUB_WORKSPACE:/var/www/html" \
            -v "$HOME/.cache/composer:/tmp/composer-cache" \
            -v "$HOME/.npm:/root/.npm" \
            -w /var/www/html \
            stashd:ci -lc '
              export COMPOSER_CACHE_DIR=/tmp/composer-cache
              git config --global --add safe.directory /var/www/html
              composer install --no-interaction --prefer-dist --no-progress
              npm ci
              composer validate --strict
              composer lint
              composer analyse
              npm run typecheck
              npm run build
            '

  build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v0.1.') && contains(github.ref_name, '-') == false)
    needs: [quality]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Skipped on pull_request: forked PRs don't have package-write access,
      # and this job only validates the build there (push: false below).
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v0.1.') && contains(github.ref_name, '-') == false
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags/labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/lost-and-fonds/stashd
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v0.1.') && !contains(github.ref_name, '-') }}

      - name: Start ${{ matrix.architecture }} build timer
        run: echo "PLATFORM_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      # PRs and manual validation build both platforms without pushing.
      # Release tags push one platform image from each native runner; the
      # manifest job below joins those exact digests without rebuilding them.
      - name: Build ${{ matrix.architecture }} image
        id: platform-build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          platforms: ${{ matrix.platform }}
          build-args: TARGETARCH=${{ matrix.architecture }}
          provenance: false
          push: ${{ startsWith(github.ref, 'refs/tags/v0.1.') && !contains(github.ref_name, '-') }}
          outputs: ${{ startsWith(github.ref, 'refs/tags/v0.1.') && !contains(github.ref_name, '-') && 'type=image,name=ghcr.io/lost-and-fonds/stashd,name-canonical=true,push-by-digest=true,push=true' || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prod-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=prod-${{ matrix.architecture }}
        env:
          BUILDKIT_PROGRESS: plain

      - name: Record ${{ matrix.architecture }} build timing
        if: always()
        run: |
          echo "${{ matrix.architecture }} image build elapsed: $(( $(date +%s) - PLATFORM_BUILD_START )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save release digest
        if: startsWith(github.ref, 'refs/tags/v0.1.') && contains(github.ref_name, '-') == false
        run: |
          mkdir -p digest
          echo "${{ steps.platform-build.outputs.digest }}" > digest/${{ matrix.architecture }}

      - name: Upload release digest
        if: startsWith(github.ref, 'refs/tags/v0.1.') && contains(github.ref_name, '-') == false
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.architecture }}
          path: digest/${{ matrix.architecture }}

  manifest:
    if: startsWith(github.ref, 'refs/tags/v0.1.') && contains(github.ref_name, '-') == false
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags/labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/lost-and-fonds/stashd
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v0.1.') && !contains(github.ref_name, '-') }}

      - name: Download release digests
        uses: actions/download-artifact@v7
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Assemble and verify multiarch manifest
        env:
          IMAGE: ghcr.io/lost-and-fonds/stashd
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          amd64="${IMAGE}@$(cat digests/amd64)"
          arm64="${IMAGE}@$(cat digests/arm64)"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --tag "$tag" "$amd64" "$arm64"
            docker buildx imagetools inspect "$tag"
          done <<EOF
          ${TAGS}
          EOF
