name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/v') && 'release' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Optional provider packages are path repositories for local development.
      # Keep them outside the core image/runtime dependency set while making
      # the packaged acceptance job reproducible in this monorepo checkout.
      - name: Checkout optional packages
        uses: actions/checkout@v7
        with:
          repository: Lost-and-Fonds/plugin-api
          ref: v0.1.2
          path: plugin-api
      - name: Checkout plugin SDK
        uses: actions/checkout@v7
        with:
          repository: Lost-and-Fonds/stashd-php-sdk
          ref: v0.2.12
          path: stashd-php-sdk
      - name: Checkout provider packages
        uses: actions/checkout@v7
        with:
          repository: Lost-and-Fonds/podcast
          ref: v0.2.4
          path: plugins/podcast
      - name: Checkout YouTube package
        uses: actions/checkout@v7
        with:
          repository: Lost-and-Fonds/youtube
          ref: v0.3.31
          path: plugins/youtube
      - name: Checkout Jellyfin package
        uses: actions/checkout@v7
        with:
          repository: Lost-and-Fonds/jellyfin
          ref: v0.2.6
          path: plugins/jellyfin
      - name: Checkout Plex package
        uses: actions/checkout@v7
        with:
          repository: Lost-and-Fonds/plex
          ref: v0.2.6
          path: plugins/plex

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Start dev image build timer
        run: echo "DEV_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build Lerd development image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          load: true
          tags: stashd:ci
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
        env:
          BUILDKIT_PROGRESS: plain

      - name: Record dev image build timing
        if: always()
        run: |
          echo "dev image build elapsed: $(( $(date +%s) - DEV_BUILD_START )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache Composer and npm downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/composer
            ~/.npm
          key: ${{ runner.os }}-deps-${{ hashFiles('composer.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      # PostgreSQL is the default runtime, so the suite needs one. Run it as a
      # plain container rather than a service so max_connections can be raised:
      # the test harness holds roughly one connection per test until the worker
      # exits, which exhausts the stock limit of 100.
      - name: Start PostgreSQL
        run: |
          start=$(date +%s)
          docker network create stashd-ci
          docker run -d --name stashd-ci-postgres --network stashd-ci --network-alias postgres \
            -e POSTGRES_DB=stashd \
            -e POSTGRES_USER=stashd \
            -e POSTGRES_PASSWORD=stashd-ci \
            postgres:18-alpine -c max_connections=400
          for i in $(seq 1 30); do
            docker exec stashd-ci-postgres pg_isready -U stashd -d stashd && break
            sleep 2
          done
          echo "PostgreSQL setup elapsed: $(( $(date +%s) - start )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run quality checks in Lerd
        run: |
          start=$(date +%s)
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined --cap-add SYS_ADMIN --entrypoint sh --network stashd-ci \
            -e CI=true \
            -e STASHD_RESET_TEST_DATABASE=1 \
            -e STASHD_PLUGIN_PACKAGE_ROOT=/tmp/stashd-plugin-packages \
            -e STASHD_YOUTUBE_HELPER_FIXTURE=/var/www/html/tests/fixtures/providers/youtube/fake-yt-dlp.sh \
            -e MERCURE_JWT_SECRET=ci-mercure-jwt-secret-for-tests-32-bytes \
            -e DB_CONNECTION=pgsql \
            -e DB_HOST=postgres \
            -e DB_PORT=5432 \
            -e DB_DATABASE=stashd \
            -e DB_USERNAME=stashd \
            -e DB_PASSWORD=stashd-ci \
            -e DB_ADMIN_DATABASE=postgres \
            -v "$GITHUB_WORKSPACE:/var/www/html" \
            -v "$GITHUB_WORKSPACE/plugin-api:/var/www/plugin-api:ro" \
            -v "$GITHUB_WORKSPACE/stashd-php-sdk:/var/www/stashd-php-sdk:ro" \
            -v "$GITHUB_WORKSPACE/plugins:/var/www/plugins:ro" \
            -v "$HOME/.cache/composer:/tmp/composer-cache" \
            -v "$HOME/.npm:/root/.npm" \
            -w /var/www/html \
            stashd:ci -lc '
              export COMPOSER_CACHE_DIR=/tmp/composer-cache
              rm -rf /tmp/stashd-plugin-packages
              git config --global --add safe.directory /var/www/html
              composer install --no-interaction --prefer-dist --no-progress
              npm ci
              php tempest key:generate
              composer lint
              composer test:static
              npm run typecheck
              php scripts/build-installed-plugins.php
              export STASHD_PLUGIN_PACKAGES_READY=1
              COMPOSER_PROCESS_TIMEOUT=0 composer test:parallel
              composer test:naked-core
              composer test:packaged
            '
          echo "quality dependency setup and test suite elapsed: $(( $(date +%s) - start )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"

  plugin-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run plugin runtime conformance
        run: packages/plugin-runtime/tests/run.sh

  smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Start smoke image build timer
        run: echo "SMOKE_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          load: true
          tags: stashd:smoke
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod
        env:
          BUILDKIT_PROGRESS: plain

      - name: Record smoke image build timing
        if: always()
        run: |
          echo "smoke image build elapsed: $(( $(date +%s) - SMOKE_BUILD_START )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Start smoke test timer
        run: echo "SMOKE_TEST_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Run container smoke test
        run: STASHD_SMOKE_SKIP_BUILD=1 composer test:docker-smoke
      - name: Record smoke test timing
        if: always()
        run: |
          echo "smoke test elapsed: $(( $(date +%s) - SMOKE_TEST_START )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"


  e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Start E2E image build timer
        run: echo "E2E_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build E2E image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          load: true
          tags: stashd:e2e
          cache-from: type=gha,scope=prod
        env:
          BUILDKIT_PROGRESS: plain

      - name: Record E2E image build timing
        if: always()
        run: |
          echo "E2E image build elapsed: $(( $(date +%s) - E2E_BUILD_START )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install browser dependencies
        run: |
          start=$(date +%s)
          npm ci && npx playwright install --with-deps chromium
          echo "E2E browser setup elapsed: $(( $(date +%s) - start )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run authenticated browser smoke test
        run: |
          start=$(date +%s)
          STASHD_E2E_SKIP_BUILD=1 tests/e2e/run.sh
          echo "E2E test elapsed: $(( $(date +%s) - start )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [quality, smoke, e2e, plugin-runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Skipped on pull_request: forked PRs don't have package-write access,
      # and this job only validates the build there (push: false below).
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags/labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/lost-and-fonds/stashd
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # PRs build both platforms without pushing. Release tags are the only
      # push path; main validation does not compete with release publishing.
      - name: Start multiarch build timer
        run: echo "MULTIARCH_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build (and push on release tags)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          platforms: linux/amd64,linux/arm64
        env:
          BUILDKIT_PROGRESS: plain
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod

      - name: Record multiarch build timing
        if: always()
        run: |
          echo "multiarch image build elapsed: $(( $(date +%s) - MULTIARCH_BUILD_START )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
