app:
  - app
  - packages
  - scripts
tests:
  engine: pest
  config:
    bootstrap: ../vendor/autoload.php
  suites:
    Unit:
      paths:
        - tests/Unit
      files:
        - '*Test.php'
    Feature:
      paths:
        - tests/Feature
      files:
        - '*Test.php'
  env:
    ENVIRONMENT: testing
    BASE_URI: 'http://localhost:8474'
    STASHD_PUBLIC_URL: 'http://localhost:8474'
    YOUTUBE_DATA_API_KEY: ''
    DB_CONNECTION: pgsql
    DB_HOST: lerd-postgres
    DB_PORT: '5432'
    DB_DATABASE: stashd_testing
    DB_USERNAME: postgres
    DB_PASSWORD: lerd
    DB_ADMIN_DATABASE: postgres
    STASHD_RESET_TEST_DATABASE: '1'
  ini:
    memory_limit: 512M
lint:
  provider: phpcsfixer
  preset: PER-CS3x0
  risky: true
  rules:
    declare_strict_types: true
    ordered_imports:
      sort_algorithm: alpha
    blank_line_before_statement:
      statements:
        - break
        - continue
        - do
        - for
        - foreach
        - if
        - return
        - throw
        - try
        - switch
        - while
analyse:
  level: max
  reportUnmatchedIgnoredErrors: false
  paths:
    - app
